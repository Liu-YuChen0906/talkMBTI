# Put inside /etc/nginx/sites-available/talkmbti (Ubuntu includes sites-enabled in http{}).
limit_req_zone $binary_remote_addr zone=talkmbti_api:10m rate=5r/s;
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    client_max_body_size 32k;
    client_body_timeout 15s;

    location /api/ {
        limit_req zone=talkmbti_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        # Overwrite, never append user-supplied forwarding headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 75s;
        proxy_connect_timeout 5s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
}
